# SPDX-License-Identifier: GPL-2.0-or-later
# Set the actual UniFi controller's inform endpoint, then ENABLED=1.
ENABLED=0
INFORM_URL=''
SSH_LISTEN=':2222'
MODEL='U7PG2'
# Leave all actions disabled for log-only operation.
APPLY=0
WLAN_TEST_ONLY=0
LED_CONTROL=0
# Physical reboot on an explicit controller request; unavailable in WLAN test mode.
REBOOT_CONTROL=0
# 0: refuse controller firmware updates; 1: report the offered version only.
# Both modes leave Keenetic firmware and uptime unchanged and download nothing.
REPORT_UPGRADE_VERSION=0
# Absolute paths to JSON mappings. APPLY and WLAN_TEST_ONLY require SLOTS.
SLOTS=''
# VLAN ID -> existing bridge; incompatible with WLAN_TEST_ONLY.
NETWORKS=''

# Separate instances must use separate private state and PID paths.
STATE_DIR='/opt/var/lib/unifi-keenetic'
PID_FILE='/opt/var/run/unifi-keenetic.pid'

# Experimental SAE capability advertisement only; does not enable WLAN apply.
EXPERIMENTAL_SAE=0

# Experimental WPA2 FT: optional SSID -> two-alphanumeric-symbol native MDID JSON.
# Requires matching enabled WLANs on both bands. Default remains unsupported.
EXPERIMENTAL_FT_DOMAINS=''
